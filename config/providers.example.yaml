# Pregled providera / Provider overview. Aktivacija isključivo kroz decision.yaml + env.
# Activation only via decision.yaml + env.
providers:
  jev:
    kind: hosted
    model: jev-1.13-free
    endpoint: https://opencode.ai/inference/systemone/v1/systemone
    cost: free-limited-time
    weights: closed
    env_key: OPENCODE_API_KEY
  clef_local:
    kind: local
    model: Cloudflare/clef-flash
    endpoint: http://127.0.0.1:30000/v1/systemone
    cost: free-hardware-only
    weights: open
    license: Apache-2.0
  clef_hosted_free:
    kind: hosted
    model: "@cf/cloudflare/clef-flash"
    cost: paid-by-default
    enabled_by_default: false
  future_bh_decision_2b:
    kind: reserved-slot
    status: not-trained
  future_bh_decision_4b:
    kind: reserved-slot
    status: not-trained
  future_bh_decision_9b:
    kind: reserved-slot
    status: not-trained
  anyjev_local:
    kind: local-optional
    framework: AnyJev 0.3.0 (Apache-2.0, pip install "anyjev[hf]")
    model: ""   # npr. morriszjm/Tacit-4B ili Qwen/Qwen3-4B (Decider); prazno = neregistriran
    license_note: Tacit modeli nose Apache-2.0 svojih Qwen baza; samo eksperimentalni benchmark
    enabled_by_default: false
